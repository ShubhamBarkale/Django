{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Profile Hub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'home' %}" class="brand">
                <span class="brand-icon">✨</span>
                <span>ProfileHub</span>
            </a>
            <div class="nav-links">
                <a href="{% url 'upload_profile' %}" class="nav-link">📤 Upload</a>
                <a href="{% url 'view_profile' %}" class="nav-link">👁️ View</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>Made with 💜 using Django · <span>ProfileHub</span></p>
    </footer>
</body>
</html>
