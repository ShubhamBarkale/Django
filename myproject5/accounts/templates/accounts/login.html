{% extends "accounts/base.html" %}
{% block content %}
<div class="card card-centered">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to access your premium dashboard.</p>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-block">Login</button>
    </form>
    <p class="subtitle" style="margin-top: 1.5rem; text-align: center;">
        Don't have an account? <a href="{% url 'register' %}" class="btn btn-outline" style="margin-left: 0.5rem;">Register</a>
    </p>
</div>
{% endblock %}
