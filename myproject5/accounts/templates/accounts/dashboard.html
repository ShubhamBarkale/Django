{% extends "accounts/base.html" %}
{% block content %}
<div class="card dashboard-card">
    <div class="avatar">{{ request.user.username|first|upper }}</div>
    <h2>Welcome, {{ request.user.username }}!</h2>
    <p class="subtitle">You are successfully logged in to your premium dashboard.</p>
    <div class="dashboard-meta">
        <div class="meta-item">
            <div class="label">Username</div>
            <div class="value">{{ request.user.username }}</div>
        </div>
        <div class="meta-item">
            <div class="label">Email</div>
            <div class="value">{{ request.user.email }}</div>
        </div>
        <div class="meta-item">
            <div class="label">Status</div>
            <div class="value">✅ Active</div>
        </div>
    </div>
    <div style="margin-top: 2rem;">
        <a class="btn btn-danger" href="{% url 'logout' %}">Logout</a>
    </div>
</div>
{% endblock %}
