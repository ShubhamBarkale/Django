{% extends 'base.html' %}

{% block title %}Create New Post - Blog{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-wrapper">
        <h1 class="form-title">
            <i class="fas fa-pen-fancy"></i> Create New Post
        </h1>
        
        <form method="POST" class="post-form" id="createPostForm">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="title" class="form-label">
                    <i class="fas fa-heading"></i> Post Title
                </label>
                <input 
                    type="text" 
                    id="title" 
                    name="title" 
                    class="form-input" 
                    placeholder="Enter your post title"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="category" class="form-label">
                    <i class="fas fa-tag"></i> Category
                </label>
                <select id="category" name="category" class="form-input">
                    <option value="">Select a category</option>
                    <option value="Technology">Technology</option>
                    <option value="Travel">Travel</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Food">Food</option>
                    <option value="Business">Business</option>
                    <option value="Entertainment">Entertainment</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="context" class="form-label">
                    <i class="fas fa-align-left"></i> Post Content
                </label>
                <textarea 
                    id="context" 
                    name="context" 
                    class="form-textarea" 
                    placeholder="Write your post content here..."
                    rows="12"
                    required
                ></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i> Publish Post
                </button>
                <a href="{% url 'home' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
