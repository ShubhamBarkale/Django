<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 50px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .add-btn {
            display: inline-block;
            padding: 12px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: #5568d9;
        }

        .student-list {
            margin-top: 25px;
        }

        .student-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            margin-bottom: 15px;
            background: #f8f9ff;
            border: 1px solid #e5e7f0;
            border-radius: 10px;
            transition: 0.3s;
        }

        .student-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .student-info h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .student-info p {
            color: #666;
            margin: 4px 0;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .update-btn,
        .delete-btn {
            padding: 9px 15px;
            border-radius: 7px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .update-btn {
            background: #667eea;
        }

        .update-btn:hover {
            background: #5568d9;
        }

        .delete-btn {
            background: #e74c3c;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        @media (max-width: 600px) {
            .student-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .actions {
                width: 100%;
            }

            .update-btn,
            .delete-btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student List</h1>

        <a class="add-btn" href="{% url 'add_student' %}">
            + Add Student
        </a>

        <div class="student-list">

            {% for student in students %}

                <div class="student-card">

                    <div class="student-info">

                        <h3>{{ student.name }}</h3>

                        <p>
                            <strong>Email:</strong>
                            {{ student.email }}
                        </p>

                        <p>
                            <strong>Age:</strong>
                            {{ student.age }}
                        </p>

                    </div>

                    <div class="actions">

                        <a
                            class="update-btn"
                            href="{% url 'update_student' student.id %}">
                            Update
                        </a>

                        <a
                            class="delete-btn"
                            href="{% url 'delete_student' student.id %}">
                            Delete
                        </a>

                    </div>

                </div>

            {% empty %}

                <div class="empty">
                    <p>No students found.</p>
                </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
