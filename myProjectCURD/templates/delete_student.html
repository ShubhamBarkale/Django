<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .student-name {
            font-weight: bold;
            color: #333;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button,
        a {
            padding: 11px 20px;
            border-radius: 8px;
            border: none;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .cancel-btn {
            background: #667eea;
            color: white;
        }

        .cancel-btn:hover {
            background: #5568d9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Delete Student</h1>

        <p>
            Are you sure you want to delete
            <span class="student-name">
                {{ student.name }}
            </span>?
        </p>

        <div class="buttons">

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="delete-btn">
                    Yes, Delete
                </button>
            </form>

            <a href="{% url 'student_list' %}" class="cancel-btn">
                Cancel
            </a>

        </div>

    </div>

</body>
</html>
